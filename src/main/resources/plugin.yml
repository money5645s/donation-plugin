name: ChzzkDonationBridge
version: '${version}'
main: kr.unofficialdonation.ChzzkDonationBridgePlugin
api-version: '26.2'
author: UnofficialDonation
description: Receives Chzzk donation events through a private bridge API and runs configured commands.
commands:
  api:
    description: 후원 채널과 공식 API 로그인, 테스트를 관리합니다.
    usage: /api <공식로그인|공식로그아웃|로그인|후원테스트|후원설정|로그아웃>
    permission: chzzkdonation.admin
permissions:
  chzzkdonation.admin:
    description: 치지직 후원 연결을 관리할 수 있습니다.
    default: op
  chzzkdonation.dashboard:
    description: 웹 대시보드 링크를 받을 수 있습니다.
    default: op
