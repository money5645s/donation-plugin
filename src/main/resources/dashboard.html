<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CHZZK 후원 대시보드</title>
  <style>
    :root{--bg:#090b11;--panel:#121620;--line:#282f3e;--txt:#eef2ff;--muted:#9ba6bc;--lime:#b8fa54;--purple:#c3a4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#242b45,transparent 28rem),var(--bg);color:var(--txt);font:14px system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:40px 20px 70px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.eyebrow{color:var(--lime);font:700 11px ui-monospace,monospace;letter-spacing:.15em}h1{font-size:clamp(30px,5vw,54px);letter-spacing:-.06em;margin:7px 0}h2{font-size:17px;margin:0}p{color:var(--muted);line-height:1.55}.badge,.admin-link{border:1px solid #446b2a;border-radius:30px;color:var(--lime);padding:8px 12px;font-size:12px}.admin-link{text-decoration:none;border-color:#46516d;color:#dbe5ff}.grid{display:grid;grid-template-columns:350px 1fr;gap:15px}.panel{background:linear-gradient(135deg,#161b28,#10131b);border:1px solid var(--line);border-radius:15px;padding:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.stat{padding:15px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:24px;margin-top:6px}.muted{color:var(--muted);font-size:12px}.streamer,.event{border-left:3px solid #66718c;background:#0c0f16;border-radius:8px;padding:12px;margin-top:9px}.event.donation{border-color:var(--lime)}.event.party{border-color:var(--purple)}.event.chat{border-color:#58bff2}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.types{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.type{font-size:11px;padding:3px 6px;border-radius:5px;background:#263043;color:#dce5f7}.events{max-height:630px;overflow:auto}button{border:0;border-radius:8px;background:#252c3a;color:#e3e8f3;padding:8px 10px;font-weight:800;cursor:pointer}.event p{margin:7px 0;color:#edf1fc}.event time{font:11px ui-monospace;color:var(--muted)}@media(max-width:780px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">MINECRAFT · CHZZK LIVE EVENTS</div><h1>후원 대시보드</h1><p>연결 상태와 실시간 이벤트를 보는 읽기 전용 화면입니다.</p></div><div class="row"><a class="admin-link" href="/dashboard/admin">관리자 로그인</a><div class="badge" id="connection">서버 확인 중</div></div></header>
  <section class="summary"><div class="stat"><span class="muted">온라인 플레이어</span><b id="onlineCount">0</b></div><div class="stat"><span class="muted">연결된 스트리머</span><b id="streamerCount">0</b></div><div class="stat"><span class="muted">최근 이벤트</span><b id="eventCount">0</b></div></section>
  <section class="grid"><aside><section class="panel"><div class="row"><h2>연결된 스트리머</h2><button onclick="load()">새로고침</button></div><div id="streamers"><p class="muted">불러오는 중…</p></div></section></aside><section class="panel"><h2>실시간 이벤트</h2><p class="muted">채팅, 후원, 구독, 파티 이벤트를 최근 순으로 표시합니다.</p><div id="events" class="events"><p class="muted">이벤트를 기다리는 중…</p></div></section></section>
</main><script>
const $=id=>document.getElementById(id);function esc(v){const n=document.createElement('span');n.textContent=String(v??'');return n.innerHTML}function types(v){return(v||[]).map(x=>'<span class="type">'+esc(x)+'</span>').join('')||'<span class="muted">수신 안 함</span>'}function text(e){const d=e.data||{};if(e.type==='chat')return(d.nickname||'익명')+' — '+(d.message||'');if(e.type==='donation')return(d.nickname||'익명')+' · '+Number(d.amount||0).toLocaleString()+'원 · '+(d.donationType||'');if(e.type==='subscription')return(d.nickname||'익명')+' 구독 이벤트';if(e.type==='party')return'파티 후원 이벤트';return d.message||d.result||'시스템 이벤트'}async function load(){try{const [s,r,e]=await Promise.all(['status','streamers','events'].map(x=>fetch('/api/'+x)));if(!s.ok||!r.ok||!e.ok)throw 0;const [status,streamers,events]=await Promise.all([s.json(),r.json(),e.json()]);$('connection').textContent='서버 연결됨';$('onlineCount').textContent=status.onlinePlayers.length;$('streamerCount').textContent=streamers.streamers.length;$('eventCount').textContent=events.events.length;$('streamers').innerHTML=streamers.streamers.length?streamers.streamers.map(x=>'<div class="streamer"><b>'+esc(x.minecraftName)+'</b><div class="muted">'+esc(x.channelId)+'</div><div class="types">'+types(x.enabledDonationTypes)+'</div></div>').join(''):'<p class="muted">연결된 스트리머가 없습니다.</p>';$('events').innerHTML=events.events.length?events.events.map(x=>'<article class="event '+esc(x.type)+'"><div class="row"><b>'+esc(x.type)+'</b><time>'+new Date(x.time).toLocaleTimeString('ko-KR')+'</time></div><p>'+esc(text(x))+'</p><span class="muted">'+esc(x.channelId||'server')+'</span></article>').join(''):'<p class="muted">이벤트가 아직 없습니다.</p>'}catch{$('connection').textContent='서버에 연결할 수 없음'}}load();setInterval(load,3000);
</script></body></html>
